<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .active {
            display: flex;
        }
        h1 {
            color: #d81b60;
            font-size: 28px;
        }
        .btn-group {
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 0 10px;
        }
        .yes-btn {
            background-color: #81c784;
            color: white;
        }
        .no-btn {
            background-color: #e57373;
            color: white;
            position: absolute;
        }
        img {
            width: 150px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .gift-box {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .gift {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="step1" class="container active">
        <img src="https://i.imgur.com/4AiXzf8.gif" alt="Cute cat">
        <h1>Are you my best friend? 💕</h1>
        <div class="btn-group">
            <button class="yes-btn" onclick="nextStep()">YES</button>
            <button class="no-btn" id="noBtn" onmouseover="moveButton()">NO</button>
        </div>
    </div>

    <div id="step2" class="container">
        <h1>I knew you'd say yes 💕</h1>
        <div class="gift-box">
            <div class="gift" onclick="alert('Bu yerga 1-sovg`cha matnini yozasan')">GIFT 1</div>
            <div class="gift" onclick="alert('Bu yerga 2-sovg`cha matnini yozasan')">GIFT 2</div>
            <div class="gift" onclick="alert('Bu yerga 3-sovg`cha matnini yozasan')">GIFT 3</div>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        const noTexts = [
            "Wait... are you sure? 🥺",
            "nah that's not right...",
            "try again 😭",
            "be serious...",
            "okay now you're just playing...",
            "okay last chance..."
        ];

        function moveButton() {
            const btn = document.getElementById('noBtn');
            if (noClickCount < noTexts.length) {
                btn.innerText = noTexts[noClickCount];
                noClickCount++;
            }
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;
        }

        function nextStep() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }
    </script>
</body>
</html>
